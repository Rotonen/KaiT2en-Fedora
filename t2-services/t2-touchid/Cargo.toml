[package]
name = "t2-touchid"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Bridges the Apple T2 Touch ID sensor to fprintd through libfprint's virtual device socket"

[dependencies]
anyhow = { workspace = true }
input = { workspace = true }
input-linux = { workspace = true }
libc = { workspace = true }
zbus = { workspace = true }
t2-biometrickit = { workspace = true }

[[bin]]
name = "t2-touchid"
path = "daemon/main.rs"
