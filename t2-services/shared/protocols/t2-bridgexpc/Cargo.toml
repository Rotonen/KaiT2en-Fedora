[package]
name = "t2-bridgexpc"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "RemoteXPC and BridgeXPC transport for the Apple T2 CDC-NCM link"

[dependencies]
anyhow = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
uuid = { workspace = true, features = ["v4"] }
